name: Build

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          uname -a
          cmake --version
          g++ --version

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libdrogon-dev
          sudo apt install -y libjsoncpp-dev
          sudo apt install -y uuid-dev
          sudo apt install -y libmysqlclient-dev

      - name: MySQL diagnostics
        run: |
          ls -l /usr/include/mysql || true
          find /usr -name "mysql.h" || true
          find /usr -name "libmysqlclient*" || true

      - name: Show FindMySQL
        run: |
          sed -n '1,130p' /usr/lib/x86_64-linux-gnu/cmake/Drogon/FindMySQL.cmake

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build

